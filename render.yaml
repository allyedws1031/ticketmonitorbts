services:
  - type: web
    name: bts-ticket-monitor
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: monitor-data
      mountPath: /var/data
      sizeGB: 1

      - key: FRONTEND_ORIGIN
        sync: false
